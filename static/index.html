<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RSI 스크리너 | 한국 주식</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a; --surface: #141e2e; --surface2: #1e2d42;
    --border: #2a3f5f; --accent: #00d4ff; --accent2: #ff6b35;
    --green: #00e676; --red: #ff1744; --yellow: #ffd600;
    --text: #f1f5f9; --text-dim: #94a3b8; --text-bright: #ffffff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  .container { max-width:1400px; margin:0 auto; padding:14px; position:relative; z-index:1; }

  /* 헤더 */
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--accent),#0080ff); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-family:'IBM Plex Mono',monospace; font-weight:700; color:#000; flex-shrink:0; }
  h1 { font-size:18px; font-weight:700; color:var(--text-bright); }
  .subtitle { font-size:11px; color:#90a8c0; font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .timestamp { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#90a8c0; }

  /* 통계 카드 */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; position:relative; overflow:hidden; }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); }
  .stat-card.red::before { background:var(--red); }
  .stat-card.yellow::before { background:var(--yellow); }
  .stat-card.green::before { background:var(--green); }
  .stat-label { font-size:10px; color:#b0bec5; text-transform:uppercase; letter-spacing:0.5px; font-family:'IBM Plex Mono',monospace; margin-bottom:4px; font-weight:500; }
  .stat-value { font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--text-bright); line-height:1; }
  .stat-desc { font-size:10px; color:#90a4b8; margin-top:4px; }

  /* 컨트롤 */
  .control-panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
  .btn-row { display:flex; gap:10px; margin-bottom:12px; }
  .btn { flex:1; padding:13px 8px; border-radius:8px; border:none; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:disabled { background:var(--border); color:var(--text-dim); cursor:not-allowed; }
  .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:disabled { opacity:0.5; cursor:not-allowed; }
  .filter-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .filter-item { display:flex; flex-direction:column; gap:4px; }
  .filter-label { font-size:11px; color:#b0c4d8; font-family:'IBM Plex Mono',monospace; }
  select, input[type="number"] { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:14px; outline:none; width:100%; -webkit-appearance:none; }

  /* 진행바 */
  .progress-container { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; display:none; }
  .progress-container.active { display:block; }
  .progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .progress-text { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); }
  .progress-bar-bg { background:var(--surface2); border-radius:99px; height:6px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),#0080ff); border-radius:99px; transition:width 0.3s ease; width:0%; }

  /* 공지 */
  .notice { background:rgba(0,212,255,0.07); border:1px solid rgba(0,212,255,0.2); border-radius:8px; padding:10px 12px; font-size:11px; color:#a0b8cc; margin-bottom:12px; font-family:'IBM Plex Mono',monospace; line-height:1.7; }

  /* 테이블 컨테이너 */
  .table-container { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .table-header { padding:12px 14px; border-bottom:1px solid var(--border); }
  .table-header-row1 { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .table-header-row2 { display:flex; gap:8px; align-items:center; }
  .table-title { font-size:14px; font-weight:600; color:var(--text-bright); display:flex; align-items:center; gap:8px; }
  .badge { background:rgba(0,212,255,0.15); color:var(--accent); padding:2px 8px; border-radius:99px; font-size:12px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .tabs { display:flex; gap:4px; }
  .tab { padding:6px 12px; border-radius:6px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; color:#90a8c0; border:1px solid transparent; transition:all 0.2s; white-space:nowrap; }
  .tab.active { background:rgba(0,212,255,0.1); color:var(--accent); border-color:rgba(0,212,255,0.2); }
  .search-input { flex:1; padding:7px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; outline:none; min-width:0; }
  .search-input:focus { border-color:var(--accent); }

  /* 모바일 카드 */
  .mobile-cards { display:block; }
  .desktop-table { display:none; }

  .stock-card { padding:14px; border-bottom:1px solid rgba(42,63,95,0.5); }
  .stock-card:last-child { border-bottom:none; }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
  .card-left { flex:1; min-width:0; }
  .card-rank { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-bottom:2px; }
  .card-name { font-size:17px; font-weight:700; color:var(--text-bright); margin-bottom:4px; }
  .card-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .card-code { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#7896b0; }
  .market-badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .market-kospi { background:rgba(0,212,255,0.1); color:var(--accent); }
  .market-kosdaq { background:rgba(255,107,53,0.1); color:var(--accent2); }
  .card-right { text-align:right; padding-left:12px; flex-shrink:0; }
  .card-rsi { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; line-height:1; margin-bottom:6px; }
  .card-bottom { display:flex; align-items:center; background:var(--surface2); border-radius:8px; padding:10px 12px; gap:12px; }
  .card-stat { flex-shrink:0; }
  .card-price-label { font-size:10px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-bottom:3px; }
  .card-price { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--text-bright); }
  .card-change { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
  .card-rsi-bar { flex:1; }
  .rsi-bar-label { font-size:10px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-bottom:5px; text-align:center; }
  .rsi-bar { height:6px; background:var(--border); border-radius:99px; overflow:hidden; }
  .rsi-fill { height:100%; border-radius:99px; }
  .rsi-below20 { background:#ff1744; }
  .rsi-below30 { background:#ff6d00; }
  .rsi-below40 { background:#ffd600; }
  .rsi-above40 { background:#4caf50; }

  .signal-badge { padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .signal-strong { background:rgba(255,23,68,0.15); color:#ff5252; border:1px solid rgba(255,23,68,0.3); }
  .signal-consider { background:rgba(255,214,0,0.15); color:#ffd600; border:1px solid rgba(255,214,0,0.3); }
  .signal-watch { background:rgba(100,116,139,0.15); color:var(--text-dim); border:1px solid var(--border); }

  .change-positive { color:var(--red); }
  .change-negative { color:#4fc3f7; }

  /* 데스크탑 테이블 */
  table { width:100%; border-collapse:collapse; }
  th { padding:12px 16px; text-align:left; font-size:12px; font-family:'IBM Plex Mono',monospace; color:#90a4ae; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); cursor:pointer; user-select:none; white-space:nowrap; font-weight:600; }
  th:hover { color:var(--accent); }
  td { padding:14px 16px; border-bottom:1px solid rgba(30,45,69,0.5); font-size:14px; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(0,212,255,0.03); }
  .stock-name { font-weight:600; color:var(--text-bright); }
  .stock-code { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#7896b0; margin-top:2px; }
  .price-cell { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--text-bright); }
  .rsi-wrapper { display:flex; align-items:center; gap:10px; }
  .rsi-value { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px; min-width:44px; }
  .rsi-bar-desktop { flex:1; height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; min-width:80px; }

  /* 빈 상태 */
  .empty-state { text-align:center; padding:60px 20px; }
  .empty-icon { font-size:40px; margin-bottom:12px; opacity:0.5; }
  .empty-title { font-size:16px; font-weight:600; color:var(--text-dim); margin-bottom:8px; }
  .empty-desc { font-size:13px; color:var(--text-dim); opacity:0.6; line-height:1.7; }

  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,0.3); border-top-color:#000; border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* 반응형 */
  @media (max-width:480px) {
    .stats-grid { grid-template-columns:repeat(2,1fr); }
    .stat-value { font-size:22px; }
    .timestamp { font-size:10px; }
  }

  @media (min-width:768px) {
    .container { padding:24px; }
    h1 { font-size:22px; }
    .logo-icon { width:40px; height:40px; font-size:16px; }
    .stats-grid { gap:16px; margin-bottom:20px; }
    .stat-card { padding:20px; }
    .stat-value { font-size:32px; }
    .stat-label { font-size:12px; }
    .stat-desc { font-size:12px; }
    .control-panel { display:flex; align-items:center; gap:16px; padding:20px 24px; }
    .btn-row { margin-bottom:0; flex:none; gap:12px; }
    .btn { flex:none; padding:10px 20px; font-size:13px; }
    .filter-grid { display:flex; gap:12px; align-items:center; flex:1; justify-content:flex-end; }
    .filter-item { flex-direction:row; align-items:center; }
    select, input[type="number"] { width:auto; }
    input[type="number"] { width:72px; }
    .mobile-cards { display:none; }
    .desktop-table { display:block; }
    .table-header { padding:16px 24px; }
    .table-header-row1 { margin-bottom:0; }
    .table-header-row2 { display:none; }
    .notice { font-size:12px; }
    .timestamp { font-size:12px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">RSI</div>
      <div>
        <h1>RSI 스크리너</h1>
        <div class="subtitle">KOSPI / KOSDAQ · 과매도 종목 탐색기</div>
      </div>
    </div>
    <div class="timestamp" id="timestamp">업데이트: -</div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">스캔</div>
      <div class="stat-value" id="stat-total">-</div>
      <div class="stat-desc">전체 종목</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">RSI≤30</div>
      <div class="stat-value" id="stat-strong">-</div>
      <div class="stat-desc">강한 매수</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">RSI≤40</div>
      <div class="stat-value" id="stat-consider">-</div>
      <div class="stat-desc">매수 고려</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">필터</div>
      <div class="stat-value" id="stat-filtered">-</div>
      <div class="stat-desc">표시 종목</div>
    </div>
  </div>

  <div class="control-panel">
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-quick" onclick="quickScan()">⚡ 빠른 스캔</button>
      <button class="btn btn-secondary" id="btn-full" onclick="fullScan()">🔍 전체 스캔</button>
    </div>
    <div class="filter-grid">
      <div class="filter-item">
        <span class="filter-label">RSI기준</span>
        <input type="number" id="rsi-threshold" value="40" min="1" max="100" onchange="filterTable()">
      </div>
      <div class="filter-item">
        <span class="filter-label">시장</span>
        <select id="market-filter" onchange="filterTable()">
          <option value="ALL">전체</option>
          <option value="KOSPI">KOSPI</option>
          <option value="KOSDAQ">KOSDAQ</option>
        </select>
      </div>
      <div class="filter-item">
        <span class="filter-label">정렬</span>
        <select id="sort-by" onchange="sortAndRender()">
          <option value="rsi">RSI순</option>
          <option value="change">등락률</option>
          <option value="name">종목명</option>
        </select>
      </div>
    </div>
  </div>

  <div class="progress-container" id="progress-container">
    <div class="progress-header">
      <span class="progress-text" id="progress-text">스캔 준비 중...</span>
      <span class="progress-text" id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="notice">
    💡 빠른스캔: 주요 35종목 (30초~1분) · 전체스캔: 코스피/코스닥 전종목 · 데이터: Yahoo Finance (전일종가)
  </div>

  <div class="table-container">
    <div class="table-header">
      <div class="table-header-row1">
        <div class="table-title">
          RSI ≤ <span id="threshold-display">40</span> 종목
          <span class="badge" id="result-count">0</span>
        </div>
        <!-- 데스크탑 전용 탭+검색 -->
        <div class="desktop-table" style="display:flex;align-items:center;gap:12px;">
          <div class="tabs">
            <div class="tab active" onclick="setView('rsi40',this)">RSI ≤ 40</div>
            <div class="tab" onclick="setView('all',this)">전체</div>
          </div>
          <input class="search-input" style="width:180px;" type="text" placeholder="종목명 검색..." oninput="filterTable()" id="search-desktop">
        </div>
      </div>
      <!-- 모바일 전용 탭+검색 -->
      <div class="table-header-row2">
        <div class="tabs">
          <div class="tab active" onclick="setView('rsi40',this)">RSI ≤ 40</div>
          <div class="tab" onclick="setView('all',this)">전체</div>
        </div>
        <input class="search-input" type="text" placeholder="종목명 검색..." oninput="filterTable()" id="search-mobile">
      </div>
    </div>
    <div id="table-body">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">스캔을 시작하세요</div>
        <div class="empty-desc">위의 '빠른 스캔' 버튼을 눌러<br>RSI 과매도 종목을 찾아보세요</div>
      </div>
    </div>
  </div>

</div>
<script>
  let allData = [], currentView = 'rsi40', scanInterval = null;

  function setView(view, el) {
    currentView = view;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.textContent.trim() === el.textContent.trim());
    });
    filterTable();
  }

  function setScanningUI() {
    document.getElementById('btn-quick').disabled = true;
    document.getElementById('btn-quick').innerHTML = '<span class="spinner"></span> 스캔 중...';
    document.getElementById('btn-full').disabled = true;
    document.getElementById('progress-container').classList.add('active');
  }

  function resetScanUI() {
    document.getElementById('btn-quick').disabled = false;
    document.getElementById('btn-quick').innerHTML = '⚡ 빠른 스캔';
    document.getElementById('btn-full').disabled = false;
    document.getElementById('btn-full').innerHTML = '🔍 전체 스캔';
    document.getElementById('progress-container').classList.remove('active');
  }

  async function quickScan() {
    setScanningUI();
    try {
      const res = await fetch('/api/quick-scan');
      const data = await res.json();
      if (data.status === 'scanning') {
        document.getElementById('progress-text').textContent = data.message || '스캔 중...';
        startProgressPolling(resetScanUI);
      }
    } catch(e) { alert('오류: ' + e.message); resetScanUI(); }
  }

  async function fullScan() {
    if (!confirm('전체 스캔은 시간이 소요됩니다. 진행할까요?')) return;
    setScanningUI();
    try {
      const res = await fetch('/api/scan');
      const data = await res.json();
      if (data.status === 'scanning') {
        document.getElementById('progress-text').textContent = data.message || '스캔 중...';
        startProgressPolling(resetScanUI);
      }
    } catch(e) { alert('오류: ' + e.message); resetScanUI(); }
  }

  async function checkInitialStatus() {
    try {
      const res = await fetch('/api/status');
      const status = await res.json();
      if (status.status === 'scanning') { setScanningUI(); startProgressPolling(resetScanUI); }
      else if (status.status === 'done' && status.count > 0) {
        const r = await fetch('/api/results');
        const data = await r.json();
        allData = data.all_data || data.data || [];
        renderResults();
      }
    } catch(e) {}
  }
  checkInitialStatus();

  function startProgressPolling(onDone) {
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(async () => {
      try {
        const res = await fetch('/api/status');
        const s = await res.json();
        const pct = s.total > 0 ? Math.round(s.progress / s.total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-pct').textContent = pct + '%';
        document.getElementById('progress-text').textContent = `분석 중: ${s.progress} / ${s.total} 종목`;
        if (s.status === 'done') {
          clearInterval(scanInterval); scanInterval = null;
          const r = await fetch('/api/results');
          const data = await r.json();
          allData = data.all_data || data.data || [];
          renderResults();
          if (onDone) onDone();
        }
      } catch(e) {}
    }, 500);
  }

  function getSearch() {
    return (document.getElementById('search-mobile').value || document.getElementById('search-desktop').value || '').toLowerCase();
  }

  function filterTable() {
    const threshold = parseInt(document.getElementById('rsi-threshold').value) || 40;
    const market = document.getElementById('market-filter').value;
    const search = getSearch();
    document.getElementById('threshold-display').textContent = threshold;
    let filtered = allData.filter(s => {
      return (market === 'ALL' || s.market === market)
        && (s.name.toLowerCase().includes(search) || s.code.includes(search))
        && (currentView === 'all' || s.rsi <= threshold);
    });
    sortData(filtered);
    renderTable(filtered);
    updateStats(threshold);
  }

  function sortAndRender() { filterTable(); }

  function sortData(data) {
    const by = document.getElementById('sort-by').value;
    if (by === 'rsi') data.sort((a,b) => a.rsi - b.rsi);
    else if (by === 'change') data.sort((a,b) => a.change_pct - b.change_pct);
    else data.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  }

  function updateStats(threshold) {
    document.getElementById('stat-total').textContent = allData.length || '-';
    document.getElementById('stat-strong').textContent = allData.filter(s => s.rsi <= 30).length || '-';
    document.getElementById('stat-consider').textContent = allData.filter(s => s.rsi > 30 && s.rsi <= 40).length || '-';
    document.getElementById('stat-filtered').textContent = allData.filter(s => s.rsi <= threshold).length || '-';
  }

  function renderResults() {
    document.getElementById('timestamp').textContent = '업데이트: ' + new Date().toLocaleString('ko-KR');
    filterTable();
  }

  function getRsiClass(r) { return r<=20?'rsi-below20':r<=30?'rsi-below30':r<=40?'rsi-below40':'rsi-above40'; }
  function getRsiColor(r) { return r<=30?'var(--red)':r<=40?'var(--yellow)':'var(--text)'; }
  function getSignal(r) {
    if (r<=30) return '<span class="signal-badge signal-strong">강한 매수</span>';
    if (r<=40) return '<span class="signal-badge signal-consider">매수 고려</span>';
    return '<span class="signal-badge signal-watch">관망</span>';
  }

  function renderTable(data) {
    const el = document.getElementById('table-body');
    document.getElementById('result-count').textContent = data.length;
    if (!data.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">해당 조건의 종목이 없습니다</div><div class="empty-desc">RSI 기준값이나 시장 필터를 조정해보세요</div></div>`;
      return;
    }

    const cards = data.map((s,i) => `
      <div class="stock-card">
        <div class="card-top">
          <div class="card-left">
            <div class="card-rank">#${i+1}</div>
            <div class="card-name">${s.name}</div>
            <div class="card-meta">
              <span class="card-code">${s.code}</span>
              <span class="market-badge market-${s.market.toLowerCase()}">${s.market}</span>
              ${getSignal(s.rsi)}
            </div>
          </div>
          <div class="card-right">
            <div class="card-rsi" style="color:${getRsiColor(s.rsi)}">${s.rsi}</div>
            <div style="font-size:10px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-align:right;">RSI(14)</div>
          </div>
        </div>
        <div class="card-bottom">
          <div class="card-stat">
            <div class="card-price-label">현재가</div>
            <div class="card-price">${Number(s.price).toLocaleString()}원</div>
          </div>
          <div class="card-rsi-bar">
            <div class="rsi-bar-label">RSI 강도</div>
            <div class="rsi-bar"><div class="rsi-fill ${getRsiClass(s.rsi)}" style="width:${s.rsi}%"></div></div>
          </div>
          <div class="card-stat" style="text-align:right;">
            <div class="card-price-label">등락률</div>
            <div class="card-change ${s.change_pct>=0?'change-positive':'change-negative'}">${s.change_pct>=0?'+':''}${s.change_pct}%</div>
          </div>
        </div>
      </div>`).join('');

    const rows = data.map((s,i) => `
      <tr>
        <td style="color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;">${i+1}</td>
        <td><div class="stock-name">${s.name}</div><div class="stock-code">${s.code}</div></td>
        <td><span class="market-badge market-${s.market.toLowerCase()}">${s.market}</span></td>
        <td class="price-cell">${Number(s.price).toLocaleString()}원</td>
        <td class="${s.change_pct>=0?'change-positive':'change-negative'}" style="font-family:'IBM Plex Mono',monospace;">${s.change_pct>=0?'+':''}${s.change_pct}%</td>
        <td>
          <div class="rsi-wrapper">
            <span class="rsi-value" style="color:${getRsiColor(s.rsi)}">${s.rsi}</span>
            <div class="rsi-bar-desktop"><div class="rsi-fill ${getRsiClass(s.rsi)}" style="width:${s.rsi}%"></div></div>
          </div>
        </td>
        <td>${getSignal(s.rsi)}</td>
      </tr>`).join('');

    el.innerHTML = `
      <div class="mobile-cards">${cards}</div>
      <div class="desktop-table">
        <table>
          <thead><tr><th>#</th><th>종목</th><th>시장</th><th>현재가</th><th>등락률</th><th>RSI(14)</th><th>신호</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
</script>
</body>
</html>
